<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amber</title>
<style>
:root{
  --bg:#0e1116; --chrome:#161b22; --panel:#0e1116; --raised:#1c2128;
  --ink:#e6edf3; --dim:#9aa5b1; --faint:#6e7681;
  --line:#272e37; --line-soft:#1e242c;
  --accent:#4c8dff; --accent-dim:#1f3a63;
  --crit:#ff5f56; --high:#ff9f43; --med:#e3c04a; --low:#7d8590;
  --hit:#f0a63a; --miss:#7d8590; --none:#6e7681;
  --vuln:var(--hit); --safe:var(--miss); --na:var(--none);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --row:26px;
}
:root[data-theme="light"]{
  --bg:#fff; --chrome:#f6f7f9; --panel:#fff; --raised:#f0f2f5;
  --ink:#1c2128; --dim:#57606a; --faint:#8c959f;
  --line:#d8dee4; --line-soft:#e8ebef;
  --accent:#0969da; --accent-dim:#ddeaff;
  --crit:#cf222e; --high:#bc4c00; --med:#9a6700; --low:#6e7781;
  --hit:#b26a00; --miss:#6e7781; --none:#8c959f;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 var(--ui);
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select{font:inherit;color:inherit;}

/* ── панель цели ─────────────────────────────── */
.toolbar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.brand{font-weight:700;letter-spacing:-.01em;font-size:13px;margin-right:4px;}
.brand span{color:var(--faint);font-weight:400;}
.field{display:flex;align-items:center;gap:5px;}
.field label{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
.field input{
  background:var(--bg);border:1px solid var(--line);border-radius:4px;
  padding:4px 7px;font:12px var(--mono);min-width:170px;
}
.field input:focus{outline:none;border-color:var(--accent);}
.btn{
  background:var(--accent);border:0;border-radius:4px;color:#fff;
  padding:5px 13px;font-weight:600;font-size:12px;cursor:pointer;
}
.btn:disabled{opacity:.45;cursor:default;}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500;}
.spacer{flex:1;}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);}
.led{width:7px;height:7px;border-radius:50%;background:var(--faint);}
.led.on{background:#3fb950;} .led.off{background:#cf222e;}
.led.busy{background:var(--accent);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.gauge{display:flex;align-items:baseline;gap:5px;}
.gauge b{font:700 17px var(--mono);letter-spacing:-.02em;}
.gauge s{text-decoration:none;color:var(--faint);font-size:11px;}

/* ── рабочая зона ────────────────────────────── */
.work{flex:1;display:flex;min-height:0;}
.left{
  width:620px;min-width:380px;max-width:70%;display:flex;flex-direction:column;
  background:var(--panel);
}
.splitter{
  width:5px;cursor:col-resize;background:var(--line);flex:0 0 5px;
}
.splitter:hover,.splitter.drag{background:var(--accent);}
table.grid col.c-id{width:84px;} table.grid col.c-sev{width:62px;}
table.grid col.c-owasp{width:64px;} table.grid col.c-vd{width:82px;}
.filters{
  display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line-soft);
  flex-wrap:wrap;align-items:center;background:var(--chrome);
}
.chip{
  border:1px solid var(--line);background:transparent;border-radius:3px;
  padding:2px 8px;font-size:11px;cursor:pointer;color:var(--dim);
  display:inline-flex;align-items:center;gap:4px;
}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--ink);}
.chip i{font-style:normal;font:11px var(--mono);color:var(--faint);}
.sep{width:1px;height:16px;background:var(--line);margin:0 3px;}
.filters input[type=search]{
  flex:1;min-width:90px;background:var(--bg);border:1px solid var(--line);
  border-radius:3px;padding:2px 7px;font:11.5px var(--mono);
}
.filters input[type=search]:focus{outline:none;border-color:var(--accent);}

.tablewrap{flex:1;overflow:auto;}
table.grid{width:100%;border-collapse:collapse;font:12px var(--mono);}
table.grid thead th{
  position:sticky;top:0;background:var(--chrome);z-index:1;
  text-align:left;padding:5px 8px;font:600 10.5px var(--ui);
  color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
  border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;
}
table.grid thead th:hover{color:var(--ink);}
table.grid tbody tr{height:var(--row);cursor:pointer;border-bottom:1px solid var(--line-soft);}
table.grid tbody tr:hover{background:var(--raised);}
table.grid tbody tr.sel{background:var(--accent-dim);}
table.grid td{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
td.sev{font:600 11px var(--ui);}
.sev-critical{color:var(--crit);} .sev-high{color:var(--high);}
.sev-medium{color:var(--med);} .sev-low{color:var(--low);}
td.vd{font:600 11px var(--ui);}
.vd-VULNERABLE{color:var(--vuln);} .vd-SAFE{color:var(--safe);}
.vd-INCONCLUSIVE{color:var(--na);} .vd-pending{color:var(--faint);}
td.owasp{color:var(--dim);font-size:11px;}
.mark{display:inline-block;width:3px;height:12px;border-radius:1px;vertical-align:-2px;margin-right:6px;background:transparent;}
tr.v-VULNERABLE .mark{background:var(--vuln);}
tr.v-SAFE .mark{background:var(--safe);}
tr.v-INCONCLUSIVE .mark{background:var(--na);}

/* ── деталь ──────────────────────────────────── */
.right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel);}
.dhead{padding:9px 14px;border-bottom:1px solid var(--line);background:var(--chrome);}
.dtitle{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.dtitle .id{font:700 13px var(--mono);}
.pill{
  font-size:10.5px;padding:1px 7px;border-radius:3px;
  border:1px solid var(--line);color:var(--dim);
}
.pill.owasp{border-color:var(--accent);color:var(--accent);}
.dsub{color:var(--faint);font-size:11.5px;margin-top:4px;}
.tabs{display:flex;gap:1px;padding:0 10px;background:var(--chrome);border-bottom:1px solid var(--line);}
.tabs[hidden],[hidden]{display:none !important;}
.tab{
  border:0;background:transparent;padding:7px 12px;font-size:12px;
  color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;
}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);}
.tab b{font:600 10px var(--mono);color:var(--faint);margin-left:5px;}
.dbody{flex:1;overflow:auto;padding:14px;}
.dbody>*{max-width:960px;}
.h{
  font:600 10.5px var(--ui);color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;margin:0 0 6px;
}
.h+.h{margin-top:16px;}
pre.raw{
  margin:0 0 14px;padding:10px 12px;background:var(--raised);
  border:1px solid var(--line-soft);border-radius:5px;
  font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;
}
.note{
  padding:9px 12px;background:var(--raised);border-left:2px solid var(--accent);
  border-radius:0 4px 4px 0;margin-bottom:14px;font-size:12.5px;
}
.note.bad{border-left-color:var(--vuln);}
.note.good{border-left-color:var(--safe);}
.empty{color:var(--faint);text-align:center;padding:60px 20px;font-size:12.5px;}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 14px;font-size:12.5px;margin-bottom:14px;}
.kv dt{color:var(--faint);}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;}
.bars{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
.brow{display:grid;grid-template-columns:190px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12px;}
.btrack{height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
.btrack i{display:block;height:100%;background:var(--vuln);}
.bnum{font:12px var(--mono);color:var(--dim);text-align:right;}


/* ── визуализация ─────────────────────────────── */
.viz{
  --surface:#0e1116;
  --good:var(--miss); --warn:var(--none); --crit:var(--hit);
  --track:#1c2128;
  --meter-good:var(--miss); --meter-warn:var(--none); --meter-crit:var(--hit);
}
:root[data-theme="light"] .viz{ --surface:#fff; --track:#eceff3; }

.views{display:flex;gap:2px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line);}
.view-tab{
  border:0;background:transparent;padding:8px 16px;font-size:12.5px;font-weight:500;
  color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;
}
.view-tab.on{color:var(--ink);border-bottom-color:var(--accent);}
.dash{flex:1;overflow:auto;padding:20px 24px;}
.dash-inner{max-width:1080px;margin:0 auto;}
.sect{margin-bottom:30px;}
.sect>h2{
  font:600 11px var(--ui);color:var(--faint);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 12px;
}
.sect>p.lede{color:var(--dim);font-size:12.5px;margin:-6px 0 14px;max-width:640px;}

/* герой + метр */
.hero{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:14px;}
.hero .num{font:600 56px/1 var(--ui);letter-spacing:-.03em;}
.hero .cap{color:var(--faint);font-size:12px;margin-bottom:7px;}
.meter{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin-bottom:6px;}
.meter>i{display:block;height:100%;border-radius:5px;width:0;transition:width .4s ease;}
.meter-scale{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--faint);}

/* плитки */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.tile{
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--raised);
}
.tile .lab{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;margin-bottom:6px;}
.tile .val{font:600 26px/1 var(--ui);letter-spacing:-.02em;}
.tile .sub{color:var(--faint);font-size:11.5px;margin-top:4px;}
.glyph{width:11px;height:11px;flex:0 0 11px;}

/* легенда */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);}

/* столбцы часть-целое */
.pw{display:flex;flex-direction:column;gap:11px;}
.pwrow{display:grid;grid-template-columns:220px minmax(0,1fr) 46px;gap:12px;align-items:center;}
.pwrow .name{font-size:12.5px;color:var(--ink);}
.pwrow .name small{display:block;color:var(--faint);font-size:11px;}
.pwbar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--track);}
.pwbar i{display:block;height:100%;position:relative;}
.pwbar i+i{margin-left:2px;}
.pwbar i:first-child{border-radius:4px 0 0 4px;}
.pwbar i:last-child{border-radius:0 4px 4px 0;}
.pwbar i:only-child{border-radius:4px;}
.pwbar i span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:600 11px var(--ui);color:#fff;
}
.pwnum{font:12px var(--mono);color:var(--dim);text-align:right;}

/* матрица пробников */
.matrix{display:flex;flex-direction:column;gap:10px;}
.mgroup{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:start;}
.mgroup .name{font-size:12.5px;color:var(--ink);padding-top:3px;}
.cells{display:flex;gap:5px;flex-wrap:wrap;}
.cell{
  width:34px;height:34px;border-radius:5px;border:1px solid var(--line);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:var(--track);position:relative;
}
.cell:hover{outline:2px solid var(--accent);outline-offset:1px;}
.cell b{font:600 9px var(--mono);color:#fff;}
.cell.pending b{color:var(--faint);}

/* подсказка */
#tip{
  position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--chrome);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-size:12px;max-width:300px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#tip.on{opacity:1;}
#tip b{display:block;font:600 12px var(--mono);margin-bottom:3px;}
#tip s{text-decoration:none;color:var(--dim);display:block;font-size:11.5px;}
.dash-empty{color:var(--faint);text-align:center;padding:80px 20px;font-size:13px;}


/* ── поиск (MAP-Elites) ───────────────────────── */
.ev-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;}
.ev-bar .field input{min-width:80px;}
.gridwrap{overflow-x:auto;padding-bottom:4px;}
table.mapgrid{border-collapse:separate;border-spacing:3px;}
table.mapgrid th{
  font:600 10.5px var(--ui);color:var(--faint);text-transform:uppercase;letter-spacing:.05em;
  font-weight:600;padding:0 2px 4px;text-align:center;white-space:nowrap;
}
table.mapgrid th.rowh{text-align:right;padding-right:8px;text-transform:none;
  font-size:12px;color:var(--ink);letter-spacing:0;}
table.mapgrid td{padding:0;}
.gcell{
  width:46px;height:34px;border-radius:5px;border:1px solid var(--line-soft);
  background:var(--track);cursor:default;position:relative;display:block;
}
.gcell.filled{cursor:pointer;border-color:transparent;}
.gcell.breach{box-shadow:0 0 0 2px var(--crit);}
.gcell.breach::after{
  content:"!";position:absolute;top:1px;right:4px;
  font:700 10px var(--mono);color:#fff;
}
.gcell:hover{outline:2px solid var(--accent);outline-offset:1px;}
.ramp{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);}
.ramp i{display:block;width:26px;height:9px;border-radius:2px;}
.spark{width:100%;height:64px;display:block;}
.ev-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.ev-log{
  font:11.5px var(--mono);color:var(--dim);max-height:150px;overflow:auto;
  border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;background:var(--raised);
}
.ev-log div{white-space:nowrap;}
.ev-log b{color:var(--ink);font-weight:600;}

/* ── строка состояния ────────────────────────── */
.statusbar{
  display:flex;align-items:center;gap:14px;padding:4px 12px;
  background:var(--chrome);border-top:1px solid var(--line);
  font:11.5px var(--mono);color:var(--faint);
}
.statusbar b{color:var(--ink);font-weight:600;}
.prog{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;max-width:220px;}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s;}
kbd{
  font:10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:3px;padding:0 4px;color:var(--dim);
}
</style>
</head>
<body class="viz">

<div class="toolbar">
  <div class="brand">amber <span>12 пробников</span></div>
  <div class="field"><label for="url">цель</label><input id="url" value="http://localhost:1234"></div>
  <div class="field"><label for="model">модель</label><input id="model" value="local-model"></div>
  <button class="btn" id="run">Сканировать</button>
  <button class="btn sec" id="stop" hidden>Стоп</button>
  <div class="status"><span class="led" id="led"></span><span id="ledtext">проверка…</span></div>
  <div class="spacer"></div>
  <div class="gauge"><b id="score">—</b><s>сработало</s></div>
  <button class="btn sec" id="theme" title="Тема">◐</button>
</div>

<div class="views">
  <button class="view-tab on" data-view="dash">Дашборд</button>
  <button class="view-tab" data-view="find">Находки</button>
  <button class="view-tab" data-view="evo">Поиск атак</button>
</div>

<div class="dash viz" id="dash"><div class="dash-inner" id="dashInner">
  <div class="dash-empty">Запустите сканирование — здесь появятся сводные показатели</div>
</div></div>

<div class="dash viz" id="evo" hidden><div class="dash-inner" id="evoInner"></div></div>

<div class="work" id="work" hidden>
  <div class="left">
    <div class="filters" id="filters"></div>
    <div class="tablewrap">
      <table class="grid">
        <colgroup><col class="c-id"><col class="c-sev"><col><col class="c-owasp"><col class="c-vd"></colgroup>
        <thead><tr>
          <th data-sort="probe_id">ID</th>
          <th data-sort="severity">крит.</th>
          <th data-sort="category">категория</th>
          <th data-sort="owasp">OWASP</th>
          <th data-sort="verdict">вердикт</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="splitter" id="splitter"></div>

  <div class="right">
    <div class="dhead" id="dhead"><div class="dsub">Выберите пробник в списке слева</div></div>
    <div class="tabs" id="tabs" hidden></div>
    <div class="dbody" id="dbody"><div class="empty">Нет выбранного пробника</div></div>
  </div>
</div>

<div class="statusbar">
  <span>пробников <b id="s-total">0</b></span>
  <span>сработало <b id="s-vuln" style="color:var(--hit)">0</b></span>
  <span>не сработало <b id="s-safe" style="color:var(--miss)">0</b></span>
  <span>нет данных <b id="s-na">0</b></span>
  <div class="prog"><i id="prog"></i></div>
  <span id="s-time"></span>
  <div class="spacer"></div>
  <span><kbd>j</kbd><kbd>k</kbd> навигация · <kbd>1</kbd>–<kbd>4</kbd> вкладки · <kbd>r</kbd> запуск</span>
</div>

<div id="tip"></div>
<script src="/app.js"></script>
</body>
</html>
